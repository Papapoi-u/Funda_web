<!DOCTYPE html>
<html lang="th">
<head>
    <title>Jarupat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f7f7e9;
            font-family: Itim, sans-serif;
        }
        h1 {
            color: #780b0b;
            text-align: center;
        }

        p {
            font-size: 16px;
            text-align: center;
        }

        img {
            width: 200px;
            height: 200px;
            border: 10px solid #c65f0a;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: block;
            margin: 20px auto;
        }

        table {
            width: 80%;
            /* กำหนดความกว้างของตาราง */
            border-collapse: collapse;
            /* รวมเส้นขอบของเซลล์ให้เป็นเส้นเดียว */
            margin: 20px auto;
            /* จัดให้อยู่กึ่งกลางหน้าเว็บ */
            background-color: white;
        }
        th, td {
            border: 1px solid #555555;
            /* เพิ่มเส้นขอบเซลล์ */
            padding: 12px;
            /* เพิ่มระยะห่างภายในเซลล์ */
        }
        th {
            background-color: #3498db;
            /* สีพื้นหลังของหัวตาราง */
            color: white;
            /* สีตัวอักษรของหัวตาราง */
        }
        tr:nth-child(even) {
            background-color: #a7d1d3;
            /* สลับสีพื้นหลังของแถว เพื่อให้อ่านง่ายขึ้น */
        }
        #num {
            font-size: 32px;
        }

    </style>

</head>
<body>
    <h1>หน้าแนะนำตัวของฉัน</h1>

    <img src="1773652711920.jpg" alt="รูปภาพของฉัน" width="200">
    <p>ดีคับนี่เป็นเว็บแนะนำตัวผมเอง</p>

    <table border="1">
        <thead>
            <tr>
                <th colspan="2">ข้อมูลส่วนตัว</th>
            </tr>
        </thead>
        <tbody>
 			<tr>
                <td>รหัสประจำตัว</td>
                <td>693380046-2</td>
            </tr>
            <tr>
                <td>ชื่อ</td>
                <td>นาย จารุพัฒน์ ครังกลาง</td>
            </tr>
            <tr>
                <td>อีเมล</td>
                <td>jarupat.kh@kkumail.com</td>
            </tr>
            <tr>
                <td>ความสนใจ</td>
                <td>ชอบดูหนังมากๆ ,ฟังเพลง ,เล่นเกม</td>
            </tr>
        </tbody>
    </table>
    <div class="rbox">
    <button onclick="start_random()">กดเพื่อสุ่มตัวเลข 6 หลัก</button>
    <div id="num">------</div>
</div>
<script>
    // ตัวแปร n ใช้เก็บจำนวนรอบที่เหลือในการสุ่มตัวเลข
    let n = 0;
    // เลือก div ที่มี id="num" มาเก็บไว้ในตัวแปร numElem
    let numElem = document.getElementById("num");

    // ฟังก์ชันสำหรับเริ่มการสุ่ม
    function start_random(){
        // ถ้า n มีค่ามากกว่า 0 แสดงว่ากำลังสุ่มอยู่ ให้หยุดการทำงาน
        if(n>0) return;
        // กำหนดให้ n มีค่าเท่ากับ 30 ซึ่งหมายถึงจะสุ่มตัวเลขทั้งหมด 30 รอบ
        n = 30;
        // เรียกฟังก์ชัน next_number() เพื่อเริ่มการสุ่มตัวเลข
        next_number();
    }
    // ฟังก์ชันสำหรับสุ่มตัวเลขในแต่ละรอบ
    function next_number(){
        // สุ่มตัวเลขระหว่าง 0 ถึง 999 และแปลงเป็น string
        var r =  Math.round(Math.random()*999999)+"";
        // แสดงผลตัวเลขที่สุ่มได้ใน div โดยใช้ padStart เพื่อเติม 0 ข้างหน้าให้ครบ 3 หลัก
        numElem.innerText = r.padStart(6,'0');
        // ลดค่า n ลง 1
        n--;
        // ถ้า n ยังมากกว่า 0 (ยังสุ่มไม่ครบ 50 รอบ)
        if(n>0){
            // หน่วงเวลาแล้วเรียกฟังก์ชัน next_number() อีกครั้ง เพื่อสุ่มตัวเลขรอบต่อไป
            // โดยความเร็วจะเพิ่มขึ้นเรื่อยๆ
            setTimeout(next_number,150-n);
        }
    }
</script>

</body>
</html>
